apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentmanagement-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentmanagement-mongodb
  template:
    metadata:
      labels:
        app: studentmanagement-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017