services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusflow-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://host.docker.internal:27017/campusflow"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusflow-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
